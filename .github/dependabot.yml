version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Africa/Casablanca
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      react-next:
        patterns: ['react', 'react-dom', 'react-server-dom-*', 'next', 'eslint-config-next']
        update-types: ['minor', 'patch']
      cloudflare-vite:
        patterns: ['vite', '@vitejs/*', '@cloudflare/vite-plugin', 'wrangler']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

name: Catalogue format (temporary)
on:
  push:
    branches:
      - feature/catalogue-availability-17
    paths:
      - .github/workflows/catalogue-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write app/card-view.tsx app/dashboard-editor.tsx app/lib/api-validation.ts app/lib/catalogue.ts app/lib/public-card.ts app/ui.tsx app/lib/media-storage.ts
      - name: Commit format corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/
          if ! git diff --cached --quiet; then
            git commit -m "style(catalogue): format edited files"
            git push
          fi

name: Uptime

on:
  schedule:
    # Toutes les 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vérifier le site, Supabase et R2
        id: probe
        run: node scripts/check-uptime.mjs
      - name: Ouvrir ou mettre à jour l'incident
        if: steps.probe.outputs.failure == '1' || steps.probe.outputs.email_failure == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +%FT%TZ)
          reason="santé=${{ steps.probe.outputs.code }}, accueil=${{ steps.probe.outputs.home }}, auth=${{ steps.probe.outputs.auth }}, stockage=${{ steps.probe.outputs.storage }}, e-mail=${{ steps.probe.outputs.email }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Incident soralink.link in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec détecté le $stamp ($reason)."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Incident soralink.link — $stamp" \
              --body "La vérification automatique a échoué le $stamp ($reason). Vérifier /api/health, la clé Resend si l'e-mail est en cause, les logs Pages et le dernier déploiement."
          fi
      - name: Clore l'incident après rétablissement
        if: steps.probe.outputs.failure == '0' && steps.probe.outputs.email_failure == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Incident soralink.link in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Service rétabli le $(date -u +%FT%TZ)."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Marquer la vérification en échec
        if: steps.probe.outputs.failure == '1' || steps.probe.outputs.email_failure == '1'
        run: exit 1

# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
# Reviewed security fix; keep the seven-day policy for every other release.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9
  - minimatch@11.0.4
  - '@isaacs/nonrecursive-glob-match@1.0.3'
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  sharp: 0.35.5
  satori: 0.63.2
  minimatch: 11.0.4
  fflate: 0.8.3

  # Security patch pins for transitive versions fixed by the audit.
  undici@7: 7.30.1
  ws@8: 8.21.0
  brace-expansion@5: 5.0.12
  browserslist@4: 4.28.7
  baseline-browser-mapping@2: 2.11.0
  image-size@2: 2.0.3
  fast-uri@3: 3.1.9
  esbuild@0.28: 0.28.1
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  'wrangler>esbuild': 0.28.1
